[project]
name = "anti-fraud-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dmitriy Kuznetsov", email = "dimawinflo@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "catboost>=1.2.10",
    "cmake>=4.4.2",
    "cudf-cu13>=26.8.0",
    "cuml-cu13>=26.8.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.1",
    "optuna>=4.9.0",
    "pandas>=3.0.0,<3.0.4a0",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "torch>=2.13.0",
    "xgboost>=3.4.0",
]

[project.scripts]
anti-fraud-project = "anti_fraud_project:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.2",
]

[tool.uv]
environments = [
    "platform_machine == 'x86_64' and sys_platform == 'linux'",
]
extra-index-url = ["https://pypi.nvidia.com"]
