services:
  anti-fraud:
    build: .
    container_name: anti-fraud-gpu
    runtime: nvidia          # GPU passthrough
    ports:
      - "8888:8888"          # Jupyter
    volumes:
      - ./data:/app/data     # Монтируем данные
      - ./notebooks:/app/notebooks
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
